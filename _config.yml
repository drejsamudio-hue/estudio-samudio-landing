title: "Derecho del Consumidor — Estudio Samudio"
description: "Evaluación gratuita y orientativa de tu caso de consumo: planes de ahorro de autos, reclamos bancarios, fintech y débitos duplicados. Posadas y toda la provincia de Misiones."
url: "https://drejsamudio-hue.github.io"
baseurl: "/estudio-samudio-landing"
lang: es-AR
permalink: /notas/:slug/
future: true

# --- SEO / Social ---
# Cuando migres a dominio propio, cambiá solo url y baseurl:
# url: "https://estudiosamudio.com.ar"
# baseurl: ""
# y dejá el resto igual. El canonical se regenera solo.
logo: "/assets/og-estudio-samudio-1200x630.jpg"
image: "/assets/og-estudio-samudio-1200x630.jpg"
twitter:
  username: "EstudioSamudio"
  card: summary_large_image
social:
  name: "Estudio Samudio"
  links:
    - "https://www.instagram.com/estudiosamudio"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - informes
  - scripts

# Defaults para que cada nota herede SEO completo sin repetir front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "Estudio Samudio"
      lang: es-AR
      image: /assets/og-estudio-samudio-1200x630.jpg
  - scope:
      path: ""
    values:
      image: /assets/og-estudio-samudio-1200x630.jpg

google_site_verification: _HS1KM4Xkb18yj0IjsEpAEhBSPfrn4RSJjV0czsKsGM

author:
