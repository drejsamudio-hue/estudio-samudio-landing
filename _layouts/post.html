---
layout: default
---
<article class="nota">
<style>
  .nota .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
                 color:var(--tierra);font-weight:600;margin:0 0 14px;opacity:.85}
  .nota h1{font-family:var(--serif);font-weight:800;font-size:clamp(32px,6vw,46px);line-height:1.05;
            letter-spacing:-1.2px;color:var(--tinta);margin:0 0 16px;text-wrap:balance}
  .nota .dek{font-size:17.5px;color:var(--tinta-70);margin:0 0 30px;line-height:1.55;max-width:52ch}
  .nota h2{font-family:var(--serif);font-weight:700;font-size:clamp(22px,4vw,27px);letter-spacing:-.6px;
            color:var(--tinta);margin:36px 0 14px}
  .nota p{margin:0 0 16px}
  .nota ul,.nota ol{margin:0 0 16px;padding-left:22px}
  .nota li{margin:0 0 8px}
  .nota blockquote{border-left:3px solid var(--tierra);margin:24px 0;padding:2px 0 2px 18px;
                    color:var(--tinta-70);font-size:15.5px}
  .nota strong{color:var(--tinta);font-weight:600}
  .disclaimer-final{font-family:var(--mono);font-size:12.5px;color:var(--tinta-45);
                     border-top:1px solid var(--linea);padding-top:18px;margin-top:32px}
  .cta-caja{background:var(--papel2);border:1px solid var(--linea);border-radius:4px;padding:22px 24px;margin:30px 0}
  .cta-caja p{margin:0 0 14px;font-size:16px}
  .cta-btn{display:inline-block;background:linear-gradient(180deg,var(--tierra-claro),var(--tierra));
           color:#fff !important;text-decoration:none;font-weight:600;padding:13px 22px;border-radius:9px;
           font-size:16px;box-shadow:0 10px 22px -12px rgba(168,69,42,.7)}
  .cta-btn:hover{filter:brightness(1.06)}
  .relacionadas{border-top:1px solid var(--linea);margin:34px 0 0;padding-top:18px}
  .relacionadas .rel-t{font-family:var(--mono);font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;
                       color:var(--tinta-45);font-weight:600;margin:0 0 10px}
  .relacionadas ul{list-style:none;margin:0;padding:0}
  .relacionadas li{margin:0 0 8px;font-size:15.5px;line-height:1.5}
  .relacionadas a{color:var(--tierra-oscuro);text-decoration:none;border-bottom:1px solid var(--linea-fuerte)}
  .relacionadas a:hover{color:var(--tierra);border-bottom-color:var(--tierra)}
</style>

<p class="eyebrow">{{ page.vertical }}</p>
<h1>{{ page.h1 | default: page.title }}</h1>
{% if page.dek %}<p class="dek">{{ page.dek }}</p>{% endif %}

{{ content }}

</article>
